<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="forgot-password-title">
    <a class="recovery-back" routerLink="/login">Back to sign in</a>
    <div class="recovery-icon" aria-hidden="true">&#128272;</div>
    <p class="recovery-eyebrow">LuxeStay account security</p>
    <h1 id="forgot-password-title">Forgot your password?</h1>
    <p class="recovery-copy">
      Enter your account email. We will show the same confirmation whether or not an account exists.
    </p>

    <div *ngIf="errorMessage" class="recovery-alert recovery-alert--error" role="alert">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="recovery-alert recovery-alert--success" role="status">{{ successMessage }}</div>

    <form *ngIf="!successMessage" #forgotForm="ngForm" (ngSubmit)="submit()" novalidate>
      <label for="reset-email">Email address</label>
      <input
        id="reset-email"
        name="email"
        type="email"
        autocomplete="email"
        required
        [(ngModel)]="email"
        placeholder="you@example.com">
      <button type="submit" [disabled]="isLoading || forgotForm.invalid">
        <span *ngIf="!isLoading">Send reset link</span>
        <span *ngIf="isLoading" aria-live="polite">Sending...</span>
      </button>
    </form>

    <p class="recovery-footnote">The link expires soon and can only be used once.</p>
  </section>
</main>
