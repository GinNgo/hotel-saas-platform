<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="reset-password-title">
    <a class="recovery-back" routerLink="/login">Back to sign in</a>
    <div class="recovery-icon" aria-hidden="true">&#128273;</div>
    <p class="recovery-eyebrow">LuxeStay account security</p>
    <h1 id="reset-password-title">Create a new password</h1>
    <p class="recovery-copy">Choose a strong password with at least 8 characters.</p>

    <div *ngIf="errorMessage" class="recovery-alert recovery-alert--error" role="alert">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="recovery-alert recovery-alert--success" role="status">{{ successMessage }}</div>

    <form *ngIf="!successMessage" #resetForm="ngForm" (ngSubmit)="submit()" novalidate>
      <label for="new-password">New password</label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required [attr.minlength]="passwordPolicy.minLength" [attr.maxlength]="passwordPolicy.maxLength" [(ngModel)]="newPassword">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required [attr.minlength]="passwordPolicy.minLength" [attr.maxlength]="passwordPolicy.maxLength" [(ngModel)]="confirmPassword">
      <button type="submit" [disabled]="isLoading || resetForm.invalid || !token">
        <span *ngIf="!isLoading">Update password</span>
        <span *ngIf="isLoading" aria-live="polite">Updating...</span>
      </button>
    </form>

    <a *ngIf="successMessage" class="recovery-primary-link" routerLink="/login">Continue to sign in</a>
  </section>
</main>
